<text x="40.0" y="816.0" font-size="13" font-weight="400" fill="#022c22" text-anchor="start">· Engine 2 schreibt nur in das Vorschlagsbuch und ordnet nur, was Engine 1 als geeignet geschrieben hat.</text>
<text x="40.0" y="835.0" font-size="13" font-weight="400" fill="#022c22" text-anchor="start">· Jede verbindliche Zeile (bestätigter Auftrag, Teamentscheid, signierter Bericht, Rechnung) entsteht durch eine menschliche Handlung über eine Befehlsfunktion.</text>
<text x="40.0" y="854.0" font-size="13" font-weight="400" fill="#022c22" text-anchor="start">· Beträge rechnet nie die KI. Ein Team, das eine harte Prüfung nicht besteht, erhält nie eine Angebotszeile; der Test prüft die Zeilen, nicht die Oberfläche.</text>
