name: ci

on:
  pull_request:
  push:
    branches: [main, recovery/main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders only. The build must never reach a real database (SR-05).
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-key
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: app (lint · typecheck · unit · audit · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Supply-chain audit (runtime deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Record versions
        if: always()
        run: |
          node --version
          npm ls next react react-dom @supabase/supabase-js --depth=0 || true

  db:
    name: db (migrations · seed · pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect Supabase project
        id: detect
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No supabase/ project yet (T4) — skipping DB checks."; fi
      - uses: supabase/setup-cli@v1
        if: steps.detect.outputs.present == 'true'
        with:
          version: latest
      - name: Start local Supabase
        if: steps.detect.outputs.present == 'true'
        run: supabase start
      - name: Apply migrations and seed from scratch
        if: steps.detect.outputs.present == 'true'
        run: supabase db reset
      - name: Database tests
        if: steps.detect.outputs.present == 'true'
        run: supabase test db
      - name: Lint database
        if: steps.detect.outputs.present == 'true'
        run: supabase db lint --level error
      - name: Stop
        if: always() && steps.detect.outputs.present == 'true'
        run: supabase stop --no-backup
