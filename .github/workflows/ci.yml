name: ci

on:
  pull_request:
  push:
    branches: [main, recovery/main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: app (lint · typecheck · unit · audit · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. The build must never reach a real database (SR-05).
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: ci-placeholder-not-a-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-fund
      - name: Agent collaboration layer (docs/agents)
        run: scripts/ci-step.sh agents node scripts/agents-check.mjs
      - name: Lint
        run: scripts/ci-step.sh lint npm run lint
      - name: Typecheck
        if: success() || failure()
        run: scripts/ci-step.sh typecheck npm run typecheck
      - name: Unit tests
        if: success() || failure()
        run: scripts/ci-step.sh unit npm test
      - name: Supply-chain audit (runtime deps, fail on high/critical)
        if: success() || failure()
        run: scripts/ci-step.sh audit npm audit --omit=dev --audit-level=high
      - name: Build
        if: success() || failure()
        run: scripts/ci-step.sh build npm run build
      - name: Record versions
        if: always()
        run: scripts/ci-step.sh versions npm ls next react react-dom @supabase/supabase-js zod --depth=0

  db:
    name: db (migrations · seed · pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Detect Supabase project
        id: detect
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No supabase/ project yet (T4) — skipping DB checks."; fi
      - uses: supabase/setup-cli@v1
        if: steps.detect.outputs.present == 'true'
        with:
          version: 2.121.0
      - name: Start local Supabase
        if: steps.detect.outputs.present == 'true'
        run: supabase start
      - name: Apply migrations and seed from scratch
        if: steps.detect.outputs.present == 'true'
        run: scripts/ci-step.sh db-reset supabase db reset
      - name: Database tests
        if: steps.detect.outputs.present == 'true'
        run: scripts/ci-step.sh pgtap supabase test db
      - name: Generated types match the migrations (T14)
        if: steps.detect.outputs.present == 'true'
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -q src/lib/supabase/database.types.ts /tmp/database.types.ts >/dev/null; then
            echo "::error title=db-types drift::src/lib/supabase/database.types.ts is out of date. Push a migration change to let db-types-sync regenerate it."
            diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts | head -60
            exit 1
          fi
          echo "::notice title=db-types::in sync"
      - name: Lint database
        if: steps.detect.outputs.present == 'true'
        run: scripts/ci-step.sh db-lint supabase db lint --level error
      - name: Stop
        if: always() && steps.detect.outputs.present == 'true'
        run: supabase stop --no-backup

  e2e:
    name: e2e (auth · protected routes · Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase (applies migrations + synthetic seed)
        run: supabase start
      - name: Export local Supabase URL and key (names only are logged)
        run: |
          supabase status -o env | grep -E '^[A-Z_]+=' > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          key="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$key" ]; then
            echo "::error title=supabase env::API_URL/ANON_KEY missing. Variables present: $(cut -d= -f1 /tmp/sb.env | tr '\n' ' ')"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
      - name: Diagnose seeded test login against local Auth (status and error code only)
        if: success() || failure()
        run: |
          body=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"coach.test@navora.test","password":"navora-local-only"}' \
            "$SUPABASE_URL/auth/v1/token?grant_type=password")
          summary=$(jq -c '{error: (.error // .error_code // null), code: (.code // null), msg: (.msg // .error_description // .message // null), has_access_token: (.access_token != null)}' /tmp/auth.json 2>/dev/null || echo '"unparseable"')
          echo "::notice title=auth-diagnostic::HTTP $body $summary"
          [ "$body" = "200" ]
      - name: Self-registration must be disabled
        run: |
          code=$(curl -sS -o /tmp/signup.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"intruder@navora.test","password":"intruder-password-123"}' \
            "$SUPABASE_URL/auth/v1/signup")
          err=$(jq -r '.error_code // .code // .error // "?"' /tmp/signup.json 2>/dev/null)
          echo "::notice title=signup-check::HTTP $code $err"
          [ "$code" != "200" ]
      - name: Anon key must not read or write care data via the REST API (SR-01)
        run: |
          fail=0
          for t in cases teams care_visits care_notes quality_events partner_requests matching_requests match_candidates organizations organization_memberships team_memberships visit_reports team_decisions response_deadlines change_log exception_events; do
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/$t?select=*&limit=1")
            body=$(head -c 200 /tmp/r.json)
            if [ "$code" = "200" ] && [ "$body" != "[]" ]; then echo "::error title=anon-rest::$t readable by anon (HTTP $code)"; fail=1; fi
            echo "anon GET $t -> HTTP $code"
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"priority":true}' "$SUPABASE_URL/rest/v1/teams?id=eq.00000000-0000-4000-a000-000000000101")
          echo "anon PATCH teams -> HTTP $code"
          case "$code" in 2*) echo "::error title=anon-rest::anon PATCH teams accepted (HTTP $code)"; fail=1;; esac
          for fn in start_visit complete_visit depart_visit pause_visit resume_visit correct_visit_time record_observation record_partner_request convert_partner_request decide_matching_request team_offers team_cases plan_visit reschedule_visit remove_planned_visit add_care_plan_item retire_care_plan_item uncovered_visits set_team_priority assign_team_coach create_report_draft update_report_draft sign_report countersign_report correct_report final_report_visits matching_escalations set_response_deadline set_member_qualification handle_exception sync_exceptions operations_exceptions; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d '{}' "$SUPABASE_URL/rest/v1/rpc/$fn")
            echo "anon RPC $fn -> HTTP $code"
            case "$code" in 2*) echo "::error title=anon-rest::anon RPC $fn accepted (HTTP $code)"; fail=1;; esac
          done
          # F1: the field read function with valid arguments (a {} body would only test "function not found").
          for fn in field_visits field_notes field_reports; do
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d "{\"p_date\":\"$(date -u +%F)\"}" "$SUPABASE_URL/rest/v1/rpc/$fn")
            echo "anon RPC $fn -> HTTP $code"
            if [ "$code" = "200" ] && [ "$(head -c 2 /tmp/r.json)" != "[]" ]; then echo "::error title=anon-rest::anon RPC $fn returned rows"; fail=1; fi
          done
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/audit_events?select=*&limit=1")
          if [ "$code" = "200" ] && [ "$(head -c 2 /tmp/r.json)" != "[]" ]; then echo "::error title=anon-rest::audit_events readable by anon"; fail=1; fi
          echo "::notice title=anon-rest::checked 16 tables, audit_events, 1 write, 32 RPCs + 3 field reads; failures=$fail"
          exit $fail
      - name: Install Playwright browser
        # Retried: the apt/CDN download is occasionally flaky (PO note 2026-10-21 23:05).
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning title=playwright-install::attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - name: Build
        run: scripts/ci-step.sh e2e-build npm run build
      - name: Playwright
        run: scripts/ci-step.sh e2e npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop
        if: always()
        run: supabase stop --no-backup
