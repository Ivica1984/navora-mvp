# ADR-205 (founder decision 2026-11-18, «Variante b»): the founder's two click paths in the real staging app, started by
# hand after a slice reaches staging. Browser only: no local Supabase, no database access, no service key. The three
# demo passwords are repository secrets (Settings → Secrets and variables → Actions), set by the founder; GitHub masks
# them in the log. No trace, video, report or artifact is kept (a trace would hold the typed password). A missing secret
# or a host other than navora-staging.onrender.com fails the run (tests/staging-smoke/target.ts); it never skips.
name: staging-smoke

# Start: push a branch `staging-smoke/<label>` pointing at a commit of recovery/main (as ci-repeat uses `repeat/**`;
# workflow_dispatch only lists workflows of the default branch `main`, which does not have this file yet).
# STAB1 scope (e) (FE-099 (2), ADR-222 point 7): also after every push to recovery/main (a merge commit), once the `ci`
# `staging` job has put the migrations on navora-staging and Render serves that commit or a later one
# (scripts/staging-smoke-after-merge.mjs). A red run comments on the merged pull request for `po` and `eng` (job
# `notify`, the only job with write access; it never sees the demo passwords).
on:
  push:
    branches: ['staging-smoke/**', recovery/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # STAB1-F2 (PERF1 scope (4)): a docs-only merge into recovery/main starts no click paths (scripts/staging-smoke-scope.mjs;
  # any doubt runs them). Manual starts and `staging-smoke/**` pushes always run.
  # STG-SMOKE-1: «docs-only» is measured against the last commit whose click paths ran green, not against `^1`, so a
  # code merge whose pending run the concurrency group replaced is smoked by the next run (448e9c4 → 4310526).
  scope:
    name: staging smoke scope (docs-only merges skip)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read       # list earlier staging-smoke runs and their jobs (the base «last green smoke»)
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the base may be several merges back
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/staging-smoke-scope.mjs "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  smoke:
    name: staging smoke (founder click paths 1 and 2)
    needs: [scope]
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # after a merge: up to 50 min for `ci`, up to 20 min for Render, then the click paths
    permissions:
      contents: read
      actions: read       # read the `ci` run and its `staging` job on the merge commit
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only reviewed code gets the secrets (commit must be on recovery/main)
        run: |
          git fetch --no-tags origin recovery/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/recovery/main; then
            echo "::error title=staging-smoke::commit $GITHUB_SHA is not on recovery/main; the smoke runs only reviewed code"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-fund
      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning title=playwright-install::attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1
      - name: After a merge, wait for migrations (ci staging job) and for Render to serve the commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: https://navora-staging.onrender.com
        run: node scripts/staging-smoke-after-merge.mjs
      - name: Tested commit (repository side)
        run: echo "::notice title=staging-smoke::workflow commit ${GITHUB_SHA}; the app commit Render serves is read from Render (not from this job)"
      # #1642: a Render deploy that goes live while the click paths run (staging-smoke 44857264600: d5107f3 live at
      # 02:54:02 UTC, inside path 4) is named in the log, so a red path is not mistaken for an app defect. Diagnostic
      # only: it never turns a red run green or a green run red.
      - name: App commit Render serves before the click paths
        run: echo "SERVED_BEFORE=$(node scripts/staging-served-commit.mjs)" >> "$GITHUB_ENV"
      - name: Click paths on navora-staging
        env:
          STAGING_SMOKE_PW_KUNDEBS: ${{ secrets.STAGING_SMOKE_PW_KUNDEBS }}
          STAGING_SMOKE_PW_PFLEGEBS: ${{ secrets.STAGING_SMOKE_PW_PFLEGEBS }}
          STAGING_SMOKE_PW_PFLEGE: ${{ secrets.STAGING_SMOKE_PW_PFLEGE }}
        run: npx playwright test --config playwright.staging-smoke.config.ts
      - name: App commit Render serves after the click paths
        if: always()
        run: |
          after="$(node scripts/staging-served-commit.mjs)"
          if [ "$after" != "$SERVED_BEFORE" ]; then
            echo "::warning title=staging-smoke::Render served ${SERVED_BEFORE:-unknown} before and ${after:-unknown} after the click paths: a deploy went live during the run; a red path may be the instance swap, not an app defect"
          else
            echo "::notice title=staging-smoke::Render served ${after:-unknown} before and after the click paths (no deploy during the run)"
          fi

  # STAB1 (e): a red smoke (or an unmet precondition) is reported where `po` and `eng` read: a comment on the pull
  # request merged as this commit, otherwise an issue labelled `agents`. Only the run link, the commit and the failed
  # step names are written; never a log line (a log could echo a typed value).
  notify:
    name: report a red staging smoke
    needs: [scope, smoke]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment on the merged pull request (or open an issue)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name|startswith("staging smoke")) | .steps[] | select(.conclusion=="failure") | .name] | join("; ")')
          body="staging-smoke red on \`${SHA}\` (ref \`${REF}\`), run ${RUN_ID}: ${RUN_URL}
          Failed step: ${failed:-unknown}.
          For \`po\` and \`eng\` (STAB1 (e)): every proven path must stay green; read the job log. No log line or secret is copied here."
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.base.ref=="recovery/main" and .merged_at!=null)][0].number // empty' || true)
          if [ -n "$pr" ]; then
            gh api "repos/$REPO/issues/$pr/comments" -f body="$body" --jq '.html_url'
          else
            gh api "repos/$REPO/issues" -f title="staging-smoke red on ${SHA:0:7}" -f body="$body" -f 'labels[]=agents' --jq '.html_url'
          fi
